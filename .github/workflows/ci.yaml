name: Noema CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: noema_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d noema_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r deploy/extractors.requirements.txt
      - run: go test ./...
        env:
          NOEMA_INTEGRATION_DATABASE_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/noema_test?sslmode=disable
          NOEMA_REQUIRE_TRAFILATURA: '1'
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/noema-arm64" ./cmd/noema
      - run: docker compose -f deploy/compose.yaml --profile bootstrap run --build --rm bootstrap
      - run: docker compose -f deploy/compose.yaml run --build --rm --entrypoint trafilatura noema --version
