services:
  noema:
    build: &noema-build
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["run"]
    environment:
      - DATABASE_URL
      - DATABASE_URL_UNPOOLED
      - GITHUB_OWNER
      - GITHUB_VAULT_REPO
      - GITHUB_ARTIFACTS_REPO
      - GITHUB_TOKEN
      - GITHUB_VAULT_TOKEN
      - GITHUB_ARTIFACTS_TOKEN
      - NOEMA_WORK_DIR=/var/lib/noema
      - NOEMA_ASR_CHUNK_DURATION
      - NOEMA_VIDEO_ATTEMPT_TIMEOUT
      - NOEMA_WHISPER_MODEL
      - GEMINI_API_KEY
      - NOEMA_GEMINI_MODEL
    volumes:
      - type: bind
        source: ${NOEMA_WORK_HOST_DIR:-../data}
        target: /var/lib/noema
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  bootstrap:
    profiles: ["bootstrap"]
    build: *noema-build
    command: ["version"]
    restart: "no"
